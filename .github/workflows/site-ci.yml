name: Public site CI

on:
  pull_request:
    paths: ["site/**", "docs/**", "web/tests/visual/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "Makefile", ".github/workflows/site-*.yml"]
  push:
    branches: [master, main]
    paths: ["site/**", "docs/**", "web/tests/visual/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "Makefile", ".github/workflows/site-*.yml"]

permissions:
  contents: read

concurrency:
  group: public-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:generate
      - run: git diff --exit-code -- docs/generated site/public/llms.txt site/public/llms-full.txt
      - run: pnpm site:check
      - run: pnpm site:lint
      - run: pnpm site:test
      - run: pnpm site:build
      - run: pnpm site:validate
      - run: pnpm --dir site exec playwright install --with-deps chromium firefox webkit
      - run: pnpm site:test:e2e
      - run: pnpm site:test:visual
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: public-site-${{ github.sha }}
          path: |
            site/dist
            site/playwright-report
            site/test-results
          retention-days: 7
